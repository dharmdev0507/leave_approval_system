spring.application.name=leave_approval_system
server.port=8080

#H2 database
spring.datasource.url=jdbc:h2:mem:leavedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#camunda
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=full
camunda.bpm.deployment-resource-pattern=classpath*:**/*.bpmn

# Camunda Admin User
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.admin-user.first-name=Admin

# Create default filter
camunda.bpm.filter.create=All

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
logging.level.org.springframework.web.servlet.handler=DEBUG